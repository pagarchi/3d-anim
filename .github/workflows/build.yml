name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A Win32
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: NeonAura
          path: build/Release/NeonAura.asi
